<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gallery editor</title>
<style>
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
  /* IDENTICAL layout to index.html so the world->screen mapping matches exactly */
  body { padding: 0 5px; box-sizing: border-box; }
  .stack { position: relative; width: 100%; height: 100vh; touch-action: none; cursor: crosshair; }
  canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
  canvas#gl { background: #fff; }
  canvas#ov { pointer-events: none; }
</style>
</head>
<body>
<div class="stack">
  <canvas id="gl"></canvas>
  <canvas id="ov"></canvas>
</div>

<script>
(function () {
  'use strict';
  // Mouse editor, meant to be driven on the Pi itself with the panel in place.
  //   drag        - move the circle under the pointer
  //   wheel       - grow / shrink it, 1 mm of diameter per notch
  //   right-click - undo the last change
  // Every change is written straight back to coords.json through server.py's
  // POST /coords. Served from anywhere else there is no such endpoint, so the
  // edit is kept in localStorage instead and the page says so.
  const COORDS_URL = './coords.json';
  const SAVE_URL   = './coords';
  const LS_KEY     = 'nag.coords';
  const MAX        = 32;
  const VB = { x: 40, y: 30, w: 288, h: 512 };   // same world view as index.html
  const STEP_MM    = 1.0;        // diameter change per wheel notch
  const D_MIN = 5, D_MAX = 400;
  const SAVE_DEBOUNCE_MS = 400;

  const canvas = document.getElementById('gl');
  const ov     = document.getElementById('ov');
  const stack  = document.querySelector('.stack');
  const octx   = ov.getContext('2d');
  const gl = canvas.getContext('webgl', { antialias: true, alpha: false, premultipliedAlpha: false });
  if (!gl) { document.body.innerHTML = '<p style="font:14px sans-serif">WebGL not available.</p>'; return; }

  const VERT = `
    attribute vec2 aPos;
    void main() { gl_Position = vec4(aPos, 0.0, 1.0); }
  `;
  const FRAG = `
    precision highp float;
    const int MAX = ${MAX};
    uniform vec2  uResolution;
    uniform float uScale, uOx, uOy, uVbX, uVbY;
    uniform int   uCount;
    uniform vec2  uCenters[MAX];
    uniform float uRadii[MAX];
    uniform float uShift[MAX];
    uniform sampler2D uPalette;
    void main() {
      float wx = uVbX + (gl_FragCoord.x - uOx) / uScale;
      float wy = uVbY + ((uResolution.y - gl_FragCoord.y) - uOy) / uScale;
      vec2 world = vec2(wx, wy);
      vec3 col = vec3(1.0);
      for (int i = 0; i < MAX; i++) {
        if (i >= uCount) break;
        vec2  ctr = uCenters[i];
        float r   = uRadii[i];
        float d   = distance(world, ctr);
        if (d <= r + 1.0) {
          float t  = d / (3.0 * r);
          float pp = fract(t - uShift[i]);
          vec3  c  = texture2D(uPalette, vec2(pp, 0.5)).rgb;
          vec2  local = (world - ctr) / r;
          float hi = 1.0 - smoothstep(0.0, 1.15, distance(local, vec2(-0.40, -0.50)));
          float sh = 1.0 - smoothstep(0.0, 1.00, distance(local, vec2( 0.45,  0.62)));
          c = clamp(c + hi * 0.40 - sh * 0.12, 0.0, 1.0);
          float e = clamp((r - d) * uScale, 0.0, 1.0);
          col = mix(col, c, e);
        }
      }
      gl_FragColor = vec4(col, 1.0);
    }
  `;
  function compile(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FRAG));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const aPos = gl.getAttribLocation(prog, 'aPos');
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

  const U = {};
  for (const n of ['uResolution','uScale','uOx','uOy','uVbX','uVbY','uCount','uCenters','uRadii','uShift','uPalette'])
    U[n] = gl.getUniformLocation(prog, n);

  function hex2rgb(h){ const v=parseInt(h.slice(1),16); return [(v>>16)&255,(v>>8)&255,v&255]; }
  (function buildPalette() {
    const palette = [
      ['#FF1E78',10.0],['#D81B72',3.5],['#00B5D9',3.5],['#7AD7DC',2.5],
      ['#F2D1C7', 2.5],['#FF1020',8.5],['#D10018',5.5],['#FF1A32',6.5],
      ['#005D87', 7.5],['#53B4D8',3.5],['#FF1728',5.0],['#FF6B7D',2.5],
      ['#D7C9BF', 8.5],['#E8DDD1',4.5],['#2EB4E8',2.5],['#FF7A86',2.5],
      ['#E00018', 5.5],['#D60017',5.5],['#2AA7CC',3.5],['#D8CCC5',6.0],
      ['#E5F000', 4.0],['#10C0CC',5.0],['#FF5A8A',5.0],['#FF1F8C',6.0]
    ];
    const W = 1024, total = palette.reduce((s,p)=>s+p[1],0);
    const bands = []; let acc = 0;
    for (const [hex,w] of palette){ const a=acc/total; acc+=w; bands.push([a, acc/total, hex2rgb(hex)]); }
    const data = new Uint8Array(W*4);
    for (let x=0;x<W;x++){
      const p=x/W; let rgb=bands[bands.length-1][2];
      for (const [a,b,c] of bands){ if(p>=a && p<b){ rgb=c; break; } }
      data[x*4]=rgb[0]; data[x*4+1]=rgb[1]; data[x*4+2]=rgb[2]; data[x*4+3]=255;
    }
    const blur = (rad)=>{ const s=data.slice();
      for(let x=0;x<W;x++){ let r=0,g=0,b=0,n=0;
        for(let k=-rad;k<=rad;k++){ const xx=((x+k)%W+W)%W; r+=s[xx*4];g+=s[xx*4+1];b+=s[xx*4+2];n++; }
        data[x*4]=r/n|0; data[x*4+1]=g/n|0; data[x*4+2]=b/n|0; } };
    blur(5); blur(5);
    const tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,W,1,0,gl.RGBA,gl.UNSIGNED_BYTE,data);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.uniform1i(U.uPalette, 0);
  })();

  // ---------- state ----------
  let list = [];                 // [{id, d, cx, cy, hd}]
  let selected = -1;             // index into list
  let saveState = 'idle';        // idle | pending | ok | local | error
  const undoStack = [];
  const centers = new Float32Array(MAX*2);
  const radii   = new Float32Array(MAX);
  const shift   = new Float32Array(MAX);
  const durs    = new Float32Array(MAX);
  const offs    = new Float32Array(MAX);

  function pushUniforms(){
    for (let i=0;i<list.length && i<MAX;i++){
      centers[i*2]=list[i].cx; centers[i*2+1]=list[i].cy; radii[i]=list[i].d/2;
      durs[i]=22 + (i*0.83)%6;
      offs[i]=(i*3.7) + (i*i*0.31);
    }
  }
  function snapshot(){
    undoStack.push(JSON.stringify(list));
    if (undoStack.length > 200) undoStack.shift();
  }
  function undo(){
    if (!undoStack.length) return;
    list = JSON.parse(undoStack.pop());
    pushUniforms(); requestDraw(); queueSave();
  }

  // ---------- load ----------
  async function load(){
    let data = null;
    try {
      const res = await fetch(COORDS_URL, { cache:'no-store' });
      if (res.ok) data = await res.json();
    } catch(e) {}
    // a local-only edit from a previous session wins, so the page comes back
    // showing what was last dragged rather than silently reverting it
    try {
      const raw = localStorage.getItem(LS_KEY);
      if (raw) { const l = JSON.parse(raw); if (Array.isArray(l) && l.length) { data = l; saveState = 'local'; } }
    } catch(e) {}
    if (!Array.isArray(data)) return;
    list = data.slice(0, MAX).map((c, i) => ({
      id: c.id != null ? c.id : i+1,
      d:  +c.d, cx: +c.cx, cy: +c.cy,
      hd: c.hd != null ? c.hd : 150
    })).filter(c => isFinite(c.d) && isFinite(c.cx) && isFinite(c.cy));
    pushUniforms(); requestDraw();
  }

  // ---------- save ----------
  let saveTimer = null, saving = false, dirty = false;
  function queueSave(){
    dirty = true; saveState = 'pending'; requestDraw();
    clearTimeout(saveTimer);
    saveTimer = setTimeout(flush, SAVE_DEBOUNCE_MS);
  }
  async function flush(){
    if (saving || !dirty) return;
    saving = true; dirty = false;
    const body = JSON.stringify(list.map(c => ({
      id: c.id, d: round1(c.d), cx: round1(c.cx), cy: round1(c.cy), hd: c.hd
    })));
    try {
      const res = await fetch(SAVE_URL, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      saveState = 'ok';
      try { localStorage.removeItem(LS_KEY); } catch(e) {}
    } catch(e) {
      // no server behind this page: keep the edit locally so it is not lost
      try { localStorage.setItem(LS_KEY, body); saveState = 'local'; }
      catch(e2) { saveState = 'error'; }
    }
    saving = false;
    requestDraw();
    if (dirty) flush();
  }
  const round1 = v => Math.round(v*10)/10;

  // ---------- screen <-> world ----------
  function view(){
    const r = canvas.getBoundingClientRect();
    const scale = Math.min(r.width/VB.w, r.height/VB.h);
    return { r, scale, ox: (r.width - VB.w*scale)/2, oy: (r.height - VB.h*scale)/2 };
  }
  function toWorld(ev){
    const v = view();
    return { x: VB.x + (ev.clientX - v.r.left - v.ox)/v.scale,
             y: VB.y + (ev.clientY - v.r.top  - v.oy)/v.scale };
  }
  // Prefer a circle the pointer is actually inside; among those (they overlap,
  // since every circle is bled wider than its hole) take the nearest centre.
  // Otherwise fall back to the nearest centre within a small grab radius.
  function pick(w){
    let best = -1, bestD = Infinity, bestInside = false;
    for (let i=0;i<list.length;i++){
      const c = list[i];
      const dist = Math.hypot(w.x-c.cx, w.y-c.cy);
      const inside = dist <= c.d/2;
      if (inside && !bestInside) { best=i; bestD=dist; bestInside=true; continue; }
      if (inside === bestInside && dist < bestD) { best=i; bestD=dist; }
    }
    if (best >= 0 && (bestInside || bestD < 25)) return best;
    return -1;
  }

  // ---------- interaction ----------
  let drag = null;   // { i, dx, dy }
  stack.addEventListener('pointerdown', ev => {
    if (ev.button !== 0) return;
    const w = toWorld(ev);
    const i = pick(w);
    selected = i;
    if (i < 0) { requestDraw(); return; }
    snapshot();
    drag = { i, dx: list[i].cx - w.x, dy: list[i].cy - w.y, moved: false };
    stack.setPointerCapture(ev.pointerId);
    ev.preventDefault();
    requestDraw();
  });
  stack.addEventListener('pointermove', ev => {
    if (!drag) return;
    const w = toWorld(ev);
    const c = list[drag.i];
    c.cx = round1(w.x + drag.dx);
    c.cy = round1(w.y + drag.dy);
    drag.moved = true;
    pushUniforms(); requestDraw();
    ev.preventDefault();
  });
  function endDrag(ev){
    if (!drag) return;
    if (drag.moved) queueSave(); else undoStack.pop();   // a plain click only selects
    drag = null;
    if (ev && ev.pointerId != null && stack.hasPointerCapture(ev.pointerId))
      stack.releasePointerCapture(ev.pointerId);
  }
  stack.addEventListener('pointerup', endDrag);
  stack.addEventListener('pointercancel', endDrag);

  stack.addEventListener('wheel', ev => {
    const w = toWorld(ev);
    const i = pick(w);
    if (i < 0) return;
    ev.preventDefault();
    selected = i;
    snapshot();
    const notches = ev.deltaY > 0 ? -1 : 1;      // wheel up grows
    const c = list[i];
    c.d = round1(Math.min(D_MAX, Math.max(D_MIN, c.d + notches*STEP_MM)));
    pushUniforms(); requestDraw(); queueSave();
  }, { passive: false });

  stack.addEventListener('contextmenu', ev => { ev.preventDefault(); undo(); });

  // ---------- render ----------
  let pendingDraw = false;
  function requestDraw(){
    if (pendingDraw) return;
    pendingDraw = true;
    requestAnimationFrame(function(){ pendingDraw = false; render(); });
  }

  function render(){
    const dpr = Math.min(window.devicePixelRatio||1, 2);
    const w = Math.floor(canvas.clientWidth*dpr), h = Math.floor(canvas.clientHeight*dpr);
    if (canvas.width!==w || canvas.height!==h){ canvas.width=w; canvas.height=h; gl.viewport(0,0,w,h); }
    if (ov.width!==w || ov.height!==h){ ov.width=w; ov.height=h; }

    const scale = Math.min(w/VB.w, h/VB.h);
    const ox = (w - VB.w*scale)/2, oy = (h - VB.h*scale)/2;

    const T = 0;
    for (let i=0;i<list.length;i++){ const p=(T+offs[i])/durs[i]; shift[i]=p-Math.floor(p); }

    gl.uniform2f(U.uResolution, w, h);
    gl.uniform1f(U.uScale, scale); gl.uniform1f(U.uOx, ox); gl.uniform1f(U.uOy, oy);
    gl.uniform1f(U.uVbX, VB.x); gl.uniform1f(U.uVbY, VB.y);
    gl.uniform1i(U.uCount, list.length);
    gl.uniform2fv(U.uCenters, centers);
    gl.uniform1fv(U.uRadii, radii);
    gl.uniform1fv(U.uShift, shift);
    gl.clearColor(1,1,1,1); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

    // ---------- markers ----------
    // Kept inside the circles: the panel covers everything else, so anything
    // drawn on the background would never be seen.
    const X = wx => ox + (wx - VB.x) * scale;
    const Y = wy => oy + (wy - VB.y) * scale;
    octx.clearRect(0,0,w,h);
    octx.textAlign = 'center'; octx.textBaseline = 'middle';
    octx.lineJoin = 'round';
    for (let i=0;i<list.length;i++){
      const c = list[i];
      const px = X(c.cx), py = Y(c.cy), pr = (c.d/2) * scale;
      const fs = Math.max(13, Math.min(pr * 0.5, 0.30 * scale * 34));
      octx.font = `700 ${fs}px "DejaVu Sans", Verdana, sans-serif`;
      octx.strokeStyle = 'rgba(0,0,0,0.65)'; octx.lineWidth = Math.max(3, fs * 0.22);
      octx.strokeText(String(c.id), px, py);
      octx.fillStyle = i === selected ? '#00ff40' : 'rgba(255,255,255,0.75)';
      octx.fillText(String(c.id), px, py);

      if (i === selected) {
        // the selected circle wears its own status: a ring just inside the rim,
        // the one place a mark is still visible through the hole
        octx.strokeStyle = { pending:'#ffd400', ok:'#00ff40', local:'#ff9500',
                             error:'#ff2020', idle:'#00ff40' }[saveState];
        octx.lineWidth = Math.max(2, 0.9 * scale);
        octx.beginPath();
        octx.arc(px, py, Math.max(2, pr - octx.lineWidth), 0, Math.PI*2);
        octx.stroke();
      }
    }
  }

  window.addEventListener('resize', requestDraw);
  window.addEventListener('beforeunload', () => { if (dirty) flush(); });
  load();
})();
</script>
</body>
</html>
